# Builds both dashboards and publishes them to GitHub Pages.
#
# On election night, set the repository variable LIVE to "true" and run this
# workflow once by hand (Actions > Deploy > Run workflow). Each run then starts
# the next one when it finishes, so the live dashboard refreshes about once a
# minute; the 5-minute schedule restarts the loop if it ever breaks. Setting LIVE
# to "false" is the only way to stop it: a run that fails or is cancelled still
# starts the next one. A push to main always deploys once.
#
# AI summaries of the reports' details run when the secret ANTHROPIC_API_KEY is
# set; the variable SUMMARIES=false switches them off (docs/TECHNICAL.md).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# One run at a time; a newer waiting run replaces an older waiting one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # The schedule only acts while LIVE is on, so it costs nothing the rest of the time.
    if: github.event_name != 'schedule' || vars.LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # the exact versions in package-lock.json; no install scripts run. If it fails
      # (e.g. the npm registry is down), the build goes on without new summaries.
      - run: npm ci --ignore-scripts
        continue-on-error: true
      # the AI summaries made by earlier runs (verdicts and published summaries only)
      - name: Restore the summaries
        uses: actions/cache/restore@v4
        with:
          path: .cache/summaries.json
          key: summaries-${{ github.run_id }}
          restore-keys: summaries-
      - name: Build
        id: build
        run: node scripts/build_site.mjs _site
        env:
          TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}
          TALLY_FORM_ID: ${{ secrets.TALLY_FORM_ID }}  # a secret, so logs mask it
          EVIDEO_ELECTION: ${{ vars.EVIDEO_ELECTION }}
          # summaries need the key; SUMMARIES=false turns them off and hides them
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUMMARIES: ${{ vars.SUMMARIES }}
      - name: Save the summaries
        if: always() && steps.build.outputs.summaries_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/summaries.json
          key: summaries-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Start the next run
        if: always() && vars.LIVE == 'true' && github.event_name != 'push'
        # a run takes ~20 s: wait, so the site is rebuilt about once a minute
        run: |
          sleep 40
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
